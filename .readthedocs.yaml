# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py

# Only the lightweight doc toolchain is installed; conf.py mocks the heavy
# runtime dependencies (torch, pyvista, ...) and adds the source tree to
# sys.path, so autodoc reads the docstrings without a full install.
python:
  install:
    - requirements: docs/requirements.txt
